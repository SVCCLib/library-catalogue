<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Library Novel Catalogue</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background: #f4f4f4;
        }

        header {
            background: #2c3e50;
            color: white;
            padding: 30px;
            text-align: center;
        }

        #searchBox {
            width: 80%;
            max-width: 500px;
            padding: 12px;
            font-size: 16px;
            margin-top: 20px;
            border-radius: 5px;
            border: none;
        }

        #bookList {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            padding: 30px;
        }

        .book {
            background: white;
            border-radius: 8px;
            padding: 15px;
            text-align: center;
            box-shadow: 0 2px 6px rgba(0,0,0,0.15);
        }

        .book img {
            width: 150px;
            height: 220px;
            object-fit: cover;
            border-radius: 5px;
        }

        .book h3 {
            margin-bottom: 5px;
        }

        .book p {
            color: #555;
        }
    </style>
</head>

<body>

<header>
    <h1>📚 Library Novel Catalogue</h1>

    <input
        type="text"
        id="searchBox"
        placeholder="Search by title or author..."
    >
</header>

<div id="bookList">

    <div class="book">
        <img src="https://via.placeholder.com/150x220?text=Book+Cover" alt="Book Cover">
        <h3>Example Book</h3>
        <p>Example Author</p>
    </div>

</div>

</body>
</html>
